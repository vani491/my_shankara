    - assets/backgrounds/sunrise_background.png
    - assets/backgrounds/stir_background.png
    - assets/backgrounds/stir_popup_background.png
    - assets/backgrounds/back1.webp
    - assets/backgrounds/back2.webp
    - assets/backgrounds/back3.webp
    - assets/diya/diya-lit.png
    - assets/diya/diya-nlit.png
    - assets/diya/diya-darsan.png
    - assets/diya/diya-darsan-unlit.png
    - assets/diya/fire.png
    - assets/onboarding/onboarding-1.png
    - assets/onboarding/onboarding-2.png
