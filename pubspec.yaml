name: myshankara
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  google_sign_in: ^7.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  go_router: ^16.3.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.12.0
  flutter_signin_button: ^2.1.1
  flutter_svg: ^2.2.1
  cloud_firestore: ^6.1.0
  flutter_timezone: ^5.0.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  app_settings: ^5.1.1
  fluttertoast: ^8.2.4
  mailer: ^6.1.0
  flutter_markdown_plus: ^1.0.12

flutter_icons:
  android: true
  ios: true
  image_path: assets/branding/logo.png

flutter_native_splash:
  color: "#FFF8F0"
  color_dark: "#F9F7FF"
  image: assets/branding/splash-logo.png
  android_12:
    color: "#FFF8F0"
    color_dark: "#F9F7FF"
    image: assets/branding/splash-logo.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/logo.png
