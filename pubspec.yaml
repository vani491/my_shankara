    - assets/Diya.lottie
    - assets/Diya.json
    - assets/root-nav-icon/filled-chat.svg
    - assets/root-nav-icon/filled-home.svg
    - assets/root-nav-icon/filled-lotus.svg
    - assets/root-nav-icon/unfilled-chat.svg
