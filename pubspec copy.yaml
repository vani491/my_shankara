name: myshankara
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1
environment:
  # sdk: ^3.9.2
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  google_sign_in: ^7.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  go_router: ^16.3.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  # font_awesome_flutter: ^10.12.0
  font_awesome_flutter: ^10.4.0

  flutter_signin_button: ^2.1.1
  flutter_svg: ^2.2.1
  cloud_firestore: ^6.1.0

flutter_icons:
  android: true
  ios: true
  image_path: assets/logo.png

flutter_native_splash:
  color: "#FFF8F0"
  color_dark: "#F9F7FF"
  image: assets/Splash-icon-1152.png
  android_12:
    color: "#FFF8F0"
    color_dark: "#F9F7FF"
    image: assets/Splash-icon-1152.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Logo.png
    - assets/SevaDiyaTracker.png
    - assets/user-profile.webp
    - assets/Logo-Trans.png
    - assets/google-icon-logo.svg
    - assets/apple-logo.svg
    - assets/Guru-Chat.png
    - assets/om.png
    - assets/

  fonts:
     - family: Samarkan
       fonts:
         - asset: assets/fonts/SAMAN.TTF
